[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yantra-research-lab"
version = "0.1.0"
description = "Autonomous multi-agent quant strategy research platform (public synthetic-engine build)."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = []   # Tier-1 core runs on the standard library — clone and run, no deps

[project.optional-dependencies]
# Installed per service. The Tier-1 default path never needs any of these.
agents = ["langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4", "pydantic>=2.7,<3"]
llm    = ["anthropic[bedrock]>=0.49,<2"]          # Anthropic direct + Claude on Bedrock; Ollama needs nothing
mcp    = ["mcp>=1.10,<2"]
memory = ["fastembed>=0.3,<0.8"]                  # optional semantic layer; stdlib hashed embedder is the fallback
ops    = ["logfire>=4,<5"]                        # bundles OpenTelemetry
dev    = ["pytest>=8", "ruff>=0.6"]
all    = ["yantra-research-lab[agents,llm,mcp,memory,ops,dev]"]

[project.scripts]
yantra-research = "research_lab.run:main"

[tool.setuptools]
packages = ["research_lab", "research_lab.agents", "synthetic_engine", "mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests", "research_lab/tests"]
