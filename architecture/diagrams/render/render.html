<!doctype html><html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script>window.EXCALIDRAW_ASSET_PATH="https://cdn.jsdelivr.net/npm/@excalidraw/excalidraw@0.17.6/dist/";</script>
<script src="https://cdn.jsdelivr.net/npm/@excalidraw/excalidraw@0.17.6/dist/excalidraw.production.min.js"></script>
<style>body{margin:0;background:#fff}#out svg{display:block}</style></head>
<body><div id="out"></div>
<script>
window.renderScene = async (scene) => {
  const svg = await ExcalidrawLib.exportToSvg({elements: scene.elements, appState: {...scene.appState, exportWithDarkMode:false, exportBackground:true}, files: scene.files||{}, exportPadding: 24});
  document.getElementById('out').appendChild(svg);
  await document.fonts.ready; await new Promise(r=>setTimeout(r,800));
  return {w: svg.width.baseVal.value, h: svg.height.baseVal.value};
};
</script></body></html>
