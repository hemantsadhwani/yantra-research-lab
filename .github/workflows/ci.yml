name: ci

# Monorepo CI, path-filtered: a change to one tier only exercises that tier.
#
#   changes ─┬─ core (3.12, 3.13; stdlib only) ─┐
#            ├─ agents (3.13; .[all]) ──────────┴─ eval-gate (both arms) ─┐
#            ├─ backend
#            └─ ingestion
#
# Four test jobs, two eval gates (loop-beats-baseline on the stdlib AND the LangGraph
# loop; red-team guardrail block rate). dev/prod are GitHub *environments*, not
# directories — see docs/adr/0004-monorepo-and-environment-promotion.md.
# No deploy job: the Fly.io chatbot was retired on 17 Nov 2026 (app destroyed). The site is a static
# export on AWS, published by frontend/deploy_aws.sh.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job is offline and deterministic: no real model, no network embedder.
  ANTHROPIC_API_KEY: ''
  YANTRA_EMBEDDER: hashed
  PYTHONUTF8: '1'

jobs:
  # ---- detect which parts of the monorepo changed ----
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # paths-filter lists PR files via the API
    outputs:
      core: ${{ steps.filter.outputs.core }}
      backend: ${{ steps.filter.outputs.backend }}
      ingestion: ${{ steps.filter.outputs.ingestion }}
      frontend: ${{ steps.filter.outputs.frontend }}
      containers: ${{ steps.filter.outputs.containers }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # frontend/ is published to S3 + CloudFront by frontend/deploy_aws.sh; the
          # output is exposed for a future build job and consumed by nothing here yet.
          filters: |
            core: ['research_lab/**', 'synthetic_engine/**', 'mcp_server/**', 'llm_gateway/**', 'eval/**', 'tests/**', 'pyproject.toml']
            backend: ['backend/**', 'llm_gateway/**', 'eval/**']
            ingestion: ['ingestion/**', 'llm_gateway/**', 'eval/layout_eval.py']
            frontend: ['frontend/**']
            containers: ['backend/**', 'frontend/**', 'llm_gateway/**', 'deploy/**', 'docker-compose.yml']

  # ---- Tier-1 core: stdlib only, NO extras. Proves "clone and run, no deps". ----
  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # ruff is pinned so a new release's default rule set cannot break an unchanged tree.
      # pytest + ruff only, not the `dev` extra: `dev` also carries mlflow (optional eval
      # tracking), which would pull pydantic into a job whose point is "no extras".
      - run: pip install -e . 'pytest>=8' 'ruff==0.16.9'
      # Lint scope = the packages that are ruff-clean today. Three files carry known,
      # pre-existing findings and are excluded by name (not by rule) until fixed:
      #   research_lab/experiments/context_study.py  S110/BLE001 (try-except-pass)
      #   synthetic_engine/engine.py                 RUF046 (redundant int cast)
      #   eval/chatbot_books_eval.py                 SIM102 (collapsible if)
      # backend/ and ingestion/ are not linted yet (17 and 25 findings).
      - name: ruff
        run: >
          ruff check research_lab synthetic_engine mcp_server llm_gateway tests eval
          --extend-exclude research_lab/experiments/context_study.py,synthetic_engine/engine.py,eval/chatbot_books_eval.py
      # langgraph / mcp / pydantic tests importorskip → they SKIP here, never fail.
      - run: pytest -q tests research_lab/tests
      - name: eval-gate (stdlib arm)
        run: python -m eval.run_gate --arm stdlib
      - name: red-team guardrail gate (no backend deps)
        run: pytest -q tests/test_redteam.py

  # ---- the optional-extras tier: LangGraph loop, MCP, llm_gateway, memory ----
  agents:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[all]'
      - run: pytest -q research_lab/tests llm_gateway/tests tests
      - name: eval-gate (graph arm; fails if langgraph is missing)
        run: python -m eval.run_gate --arm graph

  # ---- public RAG chatbot backend (FastAPI) + red-team eval ----
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}   # backend imports the shared llm_gateway/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest
      - run: pytest -q
        working-directory: backend
      - name: red-team eval (offline guardrail probes)
        run: python -m eval.redteam
      # Fake judge: proves the RAGAS harness runs end to end (~2 s), not answer quality.
      - name: RAGAS-style eval harness (offline, fake judge)
        run: python -m eval.ragas_eval --fake

  # ---- Tier-3 ingestion pipeline (offline tests; no tesseract binary needed) ----
  ingestion:
    needs: changes
    if: needs.changes.outputs.ingestion == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ingestion/requirements.txt
      - run: pip install -r ingestion/requirements.txt pytest
      - run: pytest -q
        working-directory: ingestion
      # Layout router eval (WP12): the rules row is real; the slm and frontier rows are
      # FakeProviders over the 200-page synthetic set (CI has no parsed PDFs). Harness only.
      - name: layout-router eval harness (offline, fake providers)
        run: python -m eval.layout_eval --fake

  # ---- eval-gate: the research loop must still beat the baseline, on BOTH loops ----
  eval-gate:
    needs: [changes, core, agents]
    if: >-
      always() && needs.changes.outputs.core == 'true' &&
      needs.core.result == 'success' && needs.agents.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[all]'
      - run: python -m eval.run_gate --arm both

  # ---- containers: both images must build; Kubernetes manifests must render (ADR-0011) ----
  containers:
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build backend image (context = repo root)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: yantra-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: yantra-frontend:ci
          build-args: NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: render Kubernetes manifests
        run: kubectl kustomize deploy/k8s > /tmp/rendered.yaml && grep -c '^kind:' /tmp/rendered.yaml
      - name: compose file is valid
        run: docker compose config -q
