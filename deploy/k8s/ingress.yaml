apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yantra
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: yantra.local
      http:
        paths:
          # Browser -> /api-backend/... -> backend service (path prefix stripped).
          - path: /api-backend(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend
                port:
                  name: http
