# Copy to backend-secret.yaml (git-ignored) and fill in, or create it from the shell:
#   kubectl -n yantra create secret generic backend-secrets \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=QDRANT_URL= --from-literal=QDRANT_API_KEY= --from-literal=LOGFIRE_TOKEN=
# In a real cluster this Secret comes from a vault (External Secrets Operator / AWS Secrets
# Manager), never from a file in the repo.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
stringData:
  ANTHROPIC_API_KEY: ""
  QDRANT_URL: ""
  QDRANT_API_KEY: ""
  LOGFIRE_TOKEN: ""
