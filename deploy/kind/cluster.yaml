# Local Kubernetes for the app layer. One control-plane node, host ports 80/443 mapped
# for the ingress-nginx controller. Create with `make k8s-up`.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: yantra
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
