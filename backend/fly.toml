# Fly.io config for the RAG chatbot backend.
# One machine is kept warm so the first request from a recruiter/interviewer
# does not pay a ~20s cold start. Costs ~$2/mo on shared-cpu-1x; revert
# min_machines_running to 0 to go back to pay-per-traffic scale-to-zero.

app = "yantra-chatbot"
primary_region = "sin"  # Singapore (bom/Mumbai had no capacity at deploy time)

# Deploys now run from the REPO ROOT (the image needs the shared llm_gateway/ package):
#   fly deploy --config backend/fly.toml --dockerfile backend/Dockerfile .
# The root .dockerignore allowlists backend/ and llm_gateway/ only.
[build]
  dockerfile = "backend/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1   # keep one warm: no cold start for demo traffic

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 50

[[http_service.checks]]
  method = "GET"
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"

# Secrets (do NOT put them here). Set them once with:
#   fly secrets set ANTHROPIC_API_KEY=sk-ant-...
#   (or LLM_PROVIDER=bedrock + AWS_REGION / AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)
#   fly secrets set FRONTEND_ORIGIN=https://your-frontend.example.com
[env]
  # Only YANTRA_ENV=production exports Logfire spans (backend/observability.py), and
  # /api/metrics counts only spans tagged with it (backend/metrics.py).
  YANTRA_ENV = "production"
  VECTOR_BACKEND = "qdrant"
  RATE_LIMIT_PER_MIN = "20"
  DAILY_REQUEST_CAP = "500"
